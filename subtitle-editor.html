    <script>
        window.__sedLog = [];
        function __sedPush(level, parts) {
            const msg = parts.map((p) => {
                if (p instanceof Error) return p.message || String(p);
                if (typeof p === 'object' && p !== null) { try { return JSON.stringify(p); } catch (e) { return String(p); } }
                return String(p);
            }).join(' ');
            window.__sedLog.push({ level, msg, time: new Date().toLocaleTimeString() });
            if (window.__sedLog.length > 200) window.__sedLog.shift();
        }
        ['log', 'warn', 'error'].forEach((level) => {
            const original = console[level].bind(console);
            console[level] = (...args) => { __sedPush(level, args); original(...args); };
        });
        window.addEventListener('error', (e) => {
            __sedPush('error', [`Uncaught: ${e.message} (${e.filename}:${e.lineno})`]);
        });
        window.addEventListener('unhandledrejection', (e) => {
            __sedPush('error', [`Unhandled promise rejection: ${e.reason && e.reason.message ? e.reason.message : e.reason}`]);
        });
    </script>
