    <script>
        // Bộ THU LOG DEBUG cho trang này (MỚI 11/07/2026, yêu cầu Giang — điều tra bug waveform
        // không nạp được blob). VÁ SỚM NHẤT CÓ THỂ — ngay đầu <head>, TRƯỚC Tailwind/WaveSurfer —
        // để không bỏ lỡ bất kỳ console.log/warn/error nào phát sinh từ lúc trang bắt đầu chạy.
        //
        // QUAN TRỌNG: bắt CẢ `window.onerror` LẪN `unhandledrejection` — WaveSurfer.js v7 có bug
        // đã biết (dangling/unawaited promise trong Decoder#decode và WaveSurfer#load, xem GitHub
        // issue #3126 của katspaugh/wavesurfer.js) khiến lỗi giải mã audio ("Uncaught (in promise)
        // DOMException: Unable to decode audio data") CÓ THỂ không đi qua sự kiện `'error'` mà
        // wavesurfer tự bắn ra — nếu chỉ nghe `.on('error', ...)` (xem
        // event/workflow/subtitle-editor.js::_initWaveform()) có thể bỏ lỡ đúng loại lỗi đang tìm.
        // Giang xem log này TRÊN MÀN HÌNH qua nút cảnh báo góc trái khung waveform — không cần mở
        // console trình duyệt (thường không có trên di động/WebView).
        window.__sedLog = [];
        function __sedPush(level, parts) {
            const msg = parts.map((p) => {
                if (p instanceof Error) return p.message || String(p);
                if (typeof p === 'object' && p !== null) { try { return JSON.stringify(p); } catch (e) { return String(p); } }
                return String(p);
            }).join(' ');
            window.__sedLog.push({ level, msg, time: new Date().toLocaleTimeString() });
            if (window.__sedLog.length > 200) window.__sedLog.shift(); // giới hạn, tránh phình RAM
        }
        ['log', 'warn', 'error'].forEach((level) => {
            const original = console[level].bind(console);
            console[level] = (...args) => { __sedPush(level, args); original(...args); };
        });
        window.addEventListener('error', (e) => {
            __sedPush('error', [`Uncaught: ${e.message} (${e.filename}:${e.lineno})`]);
        });
        window.addEventListener('unhandledrejection', (e) => {
            __sedPush('error', [`Unhandled promise rejection: ${e.reason && e.reason.message ? e.reason.message : e.reason}`]);
        });
    </script>
