<!DOCTYPE html>
<!--
    subtitle-editor.html — Trang RIÊNG cho Subtitle Editor (MỚI 10/07/2026, phản hồi Giang —
    chuyển từ modal `#subtitle-modal` sang trang độc lập). Mở qua `?song=<key đã mã hoá>` — xem
    `service/db.js::encodeSongKeyForUrl()/decodeSongKeyFromUrl()` và
    `plan-subtitle-editor-page.md` (bản kiến trúc đầy đủ, đã duyệt).

    KHÔNG nạp lại toàn bộ index.html/main.js — trang này tự khai script RIÊNG, CHỈ những gì cần:
    Tailwind CDN + WaveSurfer.js (waveform + phát audio + vùng chọn kéo tay, THAY tự viết Worker
    decode — phản hồi Giang "nếu phức tạp thì dùng thư viện thứ 3"), service/db.js (IndexedDB
    CHUNG database với trang chính, cùng origin file://), lang.js + patch, event/bus.js,
    core/modal-choice.js (alertModal), core/subtitle/subtitles.js + subtitles-ui.js,
    event/{workflow,router,listener}/subtitle-editor.js.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subtitle Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // CÙNG FIX hover-kẹt-trên-cảm-ứng đã áp dụng ở index.html (10/07/2026) — xem comment đầy
        // đủ ở đó, không lặp lại.
        tailwind.config = { future: { hoverOnlyWhenSupported: true } };
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20260710v2">
    <!-- WaveSurfer.js v7 (UMD, global `WaveSurfer`) + Regions plugin (global `WaveSurfer.Regions`) —
         xem plan-subtitle-editor-page.md mục 1.3 (đã xác nhận API qua tài liệu chính thức trước
         khi dùng). -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
</head>
<body class="bg-[#0b0f1a] text-white min-h-screen flex flex-col overflow-hidden">

    <!-- Header — trượt cố định trên cùng, glassmorphism GIỐNG Settings (yêu cầu Giang). -->
    <div class="glass-modal flex items-center gap-3 px-4 py-3 shrink-0 z-10">
        <button id="btn-back-to-playlist" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors shrink-0" title="">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <h1 id="subtitle-editor-title" class="flex-1 min-w-0 text-sm font-bold truncate"></h1>
        <button id="btn-save-subtitles" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold transition-colors shadow shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
            <span id="btn-save-subtitles-label"></span>
        </button>
    </div>

    <!-- TOP — dải âm thanh cuộn ngang, 1 region (2 tay kéo) DUY NHẤT sống suốt vòng đời trang. -->
    <div class="shrink-0 bg-black/30 border-b border-white/10 px-2 py-3">
        <div id="waveform-container" class="w-full overflow-x-auto"></div>
    </div>

    <!-- CENTER — danh sách dòng phụ đề, LUÔN sửa được tại chỗ (xem core/subtitle/subtitles-ui.js). -->
    <div id="sub-list-container" class="flex-1 overflow-y-auto min-h-0">
        <div class="flex flex-col items-center justify-center h-full text-slate-500 gap-3 opacity-60 py-16" id="sub-empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            <span class="font-medium text-sm px-8 text-center" id="sub-empty-state-label"></span>
        </div>
    </div>

    <!-- BOTTOM — dải công cụ, glassmorphism GIỐNG Settings. 4 tool CŨ (giữ nguyên hành vi) + 2 tool
         MỚI (Lấy giờ vùng chọn / Phát vùng, yêu cầu Giang). -->
    <div class="glass-modal shrink-0 px-3 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
        <div class="grid grid-cols-6 gap-2">
            <label class="flex flex-col items-center gap-1 cursor-pointer group">
                <div class="w-full aspect-square bg-blue-600 group-hover:bg-blue-500 rounded-2xl shadow-lg flex items-center justify-center transition-colors">
                    <input type="file" id="srt-upload" accept=".srt" class="hidden">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-upload-label"></span>
            </label>
            <button id="btn-auto-timing" class="flex flex-col items-center gap-1">
                <div class="w-full aspect-square bg-rose-600 hover:bg-rose-500 rounded-2xl shadow-lg flex items-center justify-center transition-colors relative">
                    <svg id="icon-auto-timing-idle" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg id="icon-auto-timing-recording" class="w-5 h-5 text-white hidden" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" class="animate-pulse"></circle></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-auto-timing-label"></span>
            </button>
            <button id="btn-add-sub" class="flex flex-col items-center gap-1">
                <div class="w-full aspect-square bg-indigo-500 hover:bg-indigo-400 rounded-2xl shadow-lg flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-add-sub-label"></span>
            </button>
            <!-- MỚI (yêu cầu Giang) — tạo dòng từ vùng chọn waveform hiện tại. -->
            <button id="btn-create-line-from-selection" class="flex flex-col items-center gap-1">
                <div class="w-full aspect-square bg-amber-500 hover:bg-amber-400 rounded-2xl shadow-lg flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-create-from-selection-label"></span>
            </button>
            <!-- MỚI (yêu cầu Giang) — phát ĐÚNG vùng chọn (WaveSurfer Region tự lo, không cần tự viết timer). -->
            <button id="btn-play-selection" class="flex flex-col items-center gap-1">
                <div class="w-full aspect-square bg-emerald-500 hover:bg-emerald-400 rounded-2xl shadow-lg flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-play-selection-label"></span>
            </button>
            <button id="btn-export-srt" class="flex flex-col items-center gap-1">
                <div class="w-full aspect-square bg-white/10 hover:bg-white/15 rounded-2xl shadow-lg flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4 4m4-4v12"></path></svg>
                </div>
                <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-export-srt-label"></span>
            </button>
        </div>
    </div>

    <!-- ===================== SCRIPT ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
    <script src="lang/patch/patch-common.js?v=20260710v1"></script>
    <script src="lang/patch/patch-playlist.js?v=20260710v1"></script>
    <script src="lang/patch/patch-visualizer.js?v=20260708v1"></script>
    <script src="lang/patch/patch-subtitle-settings.js?v=20260709v1"></script>
    <script src="lang/patch/patch-settings-misc.js?v=20260706v2"></script>
    <script src="lang/patch/patch-file-manager.js?v=20260710v1"></script>
    <script src="lang/patch/patch-subtitle-editor.js?v=20260710v1"></script>
    <!-- lang.js hardcode Object.assign() cả 7 biến LANG_PATCH_* trên — THIẾU BẤT KỲ FILE NÀO Ở
         TRÊN đều làm lang.js ReferenceError ngay khi parse (chạy TRÊN CẢ index.html LẪN trang này,
         xem lang/lang.js) — KHÔNG được bớt file nào dù trang này chỉ thật sự DÙNG patch-common/
         patch-subtitle-editor. -->
    <script src="lang/lang.js?v=20260710v1"></script>
    <script src="core/modal-choice.js?v=20260625v9"></script>
    <script src="event/bus.js?v=20260625v10"></script>
    <script src="service/db.js?v=20260710v1"></script>
    <script src="core/subtitle/subtitles.js?v=20260710v1"></script>
    <script src="core/subtitle/subtitles-ui.js?v=20260710v1"></script>
    <script src="event/workflow/subtitle-editor.js?v=20260710v1"></script>
    <script src="event/router/subtitle-editor.js?v=20260710v1"></script>
    <!-- listener PHẢI nạp CUỐI CÙNG — tự gọi workflowSubtitleEditor.init() ngay khi chạy. -->
    <script src="event/listener/subtitle-editor.js?v=20260710v1"></script>
    <script>
        // i18n text tĩnh KHÔNG qua template literal ${t(...)} lúc parse (component của trang này
        // không phải TPL_* string — HTML viết tay ở trên) — gán SAU khi lang.js đã nạp xong.
        document.getElementById('sub-empty-state-label').textContent = t('subtitleEditor.listEmpty');
        document.getElementById('btn-save-subtitles-label').textContent = t('subtitleEditor.btnSave');
        document.getElementById('btn-back-to-playlist').title = t('subtitleEditor.btnBack');
        document.getElementById('btn-upload-label').textContent = t('subtitleEditor.btnUpload.title');
        document.getElementById('btn-auto-timing-label').textContent = t('subtitleEditor.btnAutoTiming.title');
        document.getElementById('btn-add-sub-label').textContent = t('subtitleEditor.btnAddSub.title');
        document.getElementById('btn-create-from-selection-label').textContent = t('subtitleEditor.btnCreateFromSelection.title');
        document.getElementById('btn-play-selection-label').textContent = t('subtitleEditor.btnPlaySelection.title');
        document.getElementById('btn-export-srt-label').textContent = t('subtitleEditor.btnExportSrt');
    </script>
</body>
</html>
