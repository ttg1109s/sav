<!DOCTYPE html>
<!--
    image-edit.html — Trang RIÊNG để sửa ảnh (MỚI 14/07/2026, mục cuối phản hồi Giang — "tạo page
    image-edit, chèn thư viện"). Cùng kiến trúc `subtitle-editor.html`: mở qua `?image=<key đã mã
    hoá>`, tự nạp script riêng, đọc/ghi CHUNG 1 IndexedDB với trang chính (cùng origin `file://`,
    KHÔNG cần postMessage) — xem event/workflow/image-edit.js đầu file cho chi tiết luồng.

    Thư viện: Cropper.js v1 (CDN, UMD, global `Cropper`) — crop/rotate/flip. Brightness/Contrast/
    Saturation/Grayscale dùng CSS `filter` (xem trực tiếp lúc chỉnh, "nướng" vào canvas lúc Lưu) —
    KHÔNG cần thêm thư viện thứ 2 cho phần này.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Cùng fix hover-kẹt-trên-cảm-ứng đã áp dụng ở index.html/subtitle-editor.html.
        tailwind.config = { future: { hoverOnlyWhenSupported: true } };
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20260714v2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
</head>
<body class="bg-[#0b0f1a] text-white h-screen flex flex-col overflow-hidden">

    <!-- Header — cùng khuôn subtitle-editor.html (thanh ngang full-width, viền dưới, KHÔNG glass-modal). -->
    <div class="flex items-center gap-3 px-4 py-3 shrink-0 bg-[#0f172a]/70 backdrop-blur-xl border-b border-white/10">
        <button id="btn-back-image-edit" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <h1 id="image-edit-title" class="text-sm font-bold text-white truncate flex-1"></h1>
        <button id="btn-save-image-edit" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-sm font-bold transition-colors shrink-0"></button>
    </div>

    <!-- Vùng ảnh — Cropper.js gắn vào #image-edit-source bên trong. `#image-edit-canvas-wrap` là
         nơi CSS `filter` (brightness/contrast/saturate/grayscale) được áp — filter trên phần tử CHA
         ảnh hưởng TOÀN BỘ DOM con Cropper.js tự dựng (nhiều lớp <img> chồng nhau), không cần biết
         cấu trúc nội bộ của thư viện. -->
    <div class="flex-1 min-h-0 relative bg-black">
        <div id="image-edit-canvas-wrap" class="w-full h-full">
            <img id="image-edit-source" class="max-w-full block" alt="">
        </div>
        <p id="image-edit-fatal-error" class="hidden absolute inset-0 flex items-center justify-center text-sm text-slate-400 text-center px-8"></p>
    </div>

    <!-- Thanh trượt màu — LUÔN hiện (không cần mở/đóng riêng), gọn 3 dòng. -->
    <div class="shrink-0 px-4 py-3 border-t border-white/10 flex flex-col gap-2.5">
        <div class="flex items-center gap-3">
            <span id="label-filter-brightness" class="text-[11px] text-slate-400 w-20 shrink-0"></span>
            <input id="slider-brightness" type="range" min="50" max="150" value="100" class="flex-1 accent-sky-500">
        </div>
        <div class="flex items-center gap-3">
            <span id="label-filter-contrast" class="text-[11px] text-slate-400 w-20 shrink-0"></span>
            <input id="slider-contrast" type="range" min="50" max="150" value="100" class="flex-1 accent-sky-500">
        </div>
        <div class="flex items-center gap-3">
            <span id="label-filter-saturation" class="text-[11px] text-slate-400 w-20 shrink-0"></span>
            <input id="slider-saturation" type="range" min="0" max="200" value="100" class="flex-1 accent-sky-500">
        </div>
    </div>

    <!-- Toolbar — cùng khuôn ô icon subtitle-editor.html (w-[64px] flex flex-col items-center). -->
    <div class="shrink-0 flex items-center gap-1 px-2 py-2 overflow-x-auto border-t border-white/10 bg-[#0f172a]/70">
        <button id="btn-ie-crop" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 3v3m0 0v12a1 1 0 001 1h12M6 6h12a1 1 0 011 1v12m0 0h-3m3 0v-3"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-crop-label"></span>
        </button>
        <button id="btn-ie-rotate-left" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h11a6 6 0 010 12h-2"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-rotate-left-label"></span>
        </button>
        <button id="btn-ie-rotate-right" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l6-6m0 0l-6-6m6 6H10a6 6 0 000 12h2"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-rotate-right-label"></span>
        </button>
        <button id="btn-ie-flip-h" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-fuchsia-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v18M18 8l3 4-3 4M6 8l-3 4 3 4"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-flip-h-label"></span>
        </button>
        <button id="btn-ie-flip-v" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-fuchsia-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12h18M8 18l4 3 4-3M8 6l4-3 4 3"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-flip-v-label"></span>
        </button>
        <button id="btn-ie-grayscale" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"></circle><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-grayscale-label"></span>
        </button>
        <button id="btn-ie-reset" class="w-[64px] shrink-0 flex flex-col items-center gap-1.5 py-1.5 active:opacity-50 transition-opacity">
            <svg class="w-6 h-6 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span class="text-[9px] font-medium text-slate-300 text-center truncate w-full" id="btn-ie-reset-label"></span>
        </button>
    </div>

    <!-- ===================== SCRIPT ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
    <script src="lang/patch/patch-common.js?v=20260710v1"></script>
    <script src="lang/patch/patch-playlist.js?v=20260710v1"></script>
    <script src="lang/patch/patch-visualizer.js?v=20260708v1"></script>
    <script src="lang/patch/patch-subtitle-settings.js?v=20260709v1"></script>
    <script src="lang/patch/patch-settings-misc.js?v=20260706v2"></script>
    <script src="lang/patch/patch-file-manager.js?v=20260714v5"></script>
    <script src="lang/patch/patch-subtitle-editor.js?v=20260712v5"></script>
    <script src="lang/patch/patch-image-edit.js?v=20260714v1"></script>
    <!-- lang.js Object.assign() CẢ 8 biến LANG_PATCH_* trên — THIẾU FILE NÀO cũng ReferenceError
         ngay khi parse (xem lang/lang.js) — trang này chỉ THẬT SỰ dùng patch-common/patch-file-manager
         (btnEditCaption dùng chung key)/patch-image-edit, các file còn lại nạp cho ĐỦ BỘ. -->
    <script src="lang/lang.js?v=20260714v1"></script>
    <script src="core/modal-choice.js?v=20260625v9"></script>
    <script src="event/bus.js?v=20260625v10"></script>
    <script src="service/db.js?v=20260711v1"></script>
    <script src="service/song-key-cipher.js?v=20260710v1"></script>
    <script src="core/file-manager/image.js?v=20260714v2"></script>
    <script src="event/workflow/image-edit.js?v=20260714v1"></script>
    <script src="event/router/image-edit.js?v=20260714v1"></script>
    <!-- listener PHẢI nạp CUỐI CÙNG — tự gọi workflowImageEdit.init() ngay khi chạy. -->
    <script src="event/listener/image-edit.js?v=20260714v1"></script>
    <script>
        // i18n text tĩnh (gán SAU khi lang.js đã nạp) — cùng khuôn subtitle-editor.html.
        document.getElementById('btn-save-image-edit').textContent = t('imageEdit.btnSave');
        document.getElementById('btn-ie-crop-label').textContent = t('imageEdit.btnCrop.title');
        document.getElementById('btn-ie-rotate-left-label').textContent = t('imageEdit.btnRotateLeft.title');
        document.getElementById('btn-ie-rotate-right-label').textContent = t('imageEdit.btnRotateRight.title');
        document.getElementById('btn-ie-flip-h-label').textContent = t('imageEdit.btnFlipH.title');
        document.getElementById('btn-ie-flip-v-label').textContent = t('imageEdit.btnFlipV.title');
        document.getElementById('btn-ie-grayscale-label').textContent = t('imageEdit.btnGrayscale.title');
        document.getElementById('btn-ie-reset-label').textContent = t('imageEdit.btnReset.title');
        document.getElementById('label-filter-brightness').textContent = t('imageEdit.filterBrightness');
        document.getElementById('label-filter-contrast').textContent = t('imageEdit.filterContrast');
        document.getElementById('label-filter-saturation').textContent = t('imageEdit.filterSaturation');
    </script>
</body>
</html>
