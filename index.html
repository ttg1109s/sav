           Screen, RẤT KHÔNG ổn định ở Safari tab thường. QUYẾT ĐỊNH: bỏ hẳn `viewport-fit=cover`,
           để trình duyệt tự CHỪA vùng notch/status bar theo cơ chế mặc định (ổn định tuyệt đối,
           không phụ thuộc dynamic-toolbar/bàn phím) — KHÔNG CÓ giải pháp CSS nào ổn định hơn cho
           layout, vì bản chất trình duyệt đã tự lo liệu khi tắt cover. `.safe-top`/`.safe-bottom`/
           override `#visualizer-top-bar`/`#player-container` (từng thêm ở assets/css/style.css)
           ĐÃ DỌN SẠCH (không chỉ để inert) — không còn ý nghĩa gì khi không dùng cover.
         - Vùng notch/status bar giờ do CHÍNH TRÌNH DUYỆT vẽ (không phải nội dung trang) — CSS

         NGAY ĐẦU <body>, TRƯỚC MỌI THỨ KHÁC (kể cả CDN) — hiện ra NGAY LẬP TỨC lúc trình duyệt bắt

         KHÔNG build/bundle, chạy trực tiếp qua file://).

         BUG bản trước (đã sửa): 11 thẻ <script src> CDN (Tailwind/jsmediatags/NoSleep/Three.js/
         idb-keyval/browser-id3-writer/JSZip/mammoth/turndown/toastui-editor) + 3 <link
         rel="stylesheet"> TỪNG nằm ở <head>, PHÍA TRƯỚC preloader trong thứ tự tài liệu. Vì đây là
         <script> ĐỒNG BỘ (không `async`/`defer`), trình duyệt BẮT BUỘC tải + chạy xong TOÀN BỘ 11
         thẻ đó trước khi được phép rời khỏi `<head>` để bắt đầu parse `<body>` — nghĩa là Preloader
         (nằm trong `<body>`) KHÔNG hề "hiện ra ngay lập tức" như docstring cũ mô tả: mạng chậm/CDN
         chậm phản hồi bao lâu, màn hình đen trơn (không có gì, kể cả Preloader) hiện y NGẦN đó lâu
         — đúng như Giang phản hồi. SỬA: dời NGUYÊN VẸN 11 <script>/3 <link> đó xuống ngay DƯỚI khối
         Preloader này (xem ngay sau `</script>` của Preloader) — thứ tự thực thi giữa chúng với
         nhau và với mọi file phía sau KHÔNG đổi (browser chỉ quan tâm thứ tự XUẤT HIỆN trong
         document, không quan tâm nằm trong `<head>` hay `<body>`) — CHỈ khác duy nhất: giờ Preloader
         (HTML/CSS/JS thuần, 100% inline, KHÔNG chờ mạng) đứng TRƯỚC 11 thẻ đó, nên được vẽ ra màn
         hình xong xuôi TRƯỚC KHI trình duyệt chạm vào bất kỳ request mạng nào. `<head>` giờ chỉ còn
         meta/title/favicon (không thẻ nào chặn parser).

         % THẬT (không phải animation giả định thời gian cố định) — GIỮ NGUYÊN cơ chế cũ: đếm số
         thẻ <script src> đã THỰC SỰ tải xong qua Resource Timing API
         (`performance.getEntriesByType('resource')`) so với TỔNG số thẻ `<script src>` hiện có
         trong DOM tại mỗi lần poll — vì mọi script ở app này đều nạp TUẦN TỰ, trình duyệt PARSE tới
         đâu thêm thẻ `<script>` vào `document` tới đó nên tổng số này tự hội tụ đúng khi parser đi
         hết trang — không cần hardcode số cụ thể. Tự ẩn (fade-out) khi `window.load` bắn.

         PHẦN ANIMATION MỚI (mục 2 phản hồi Giang — "thêm animation, xem style rồi tách/thêm mới,
         dùng thẻ style trực tiếp"): mọi animation định nghĩa NGAY TRONG <style> này (không tách
         file .css riêng — Preloader phải tự đứng độc lập, không được phép chờ assets/css/style.css
         qua mạng/cache mới hiển thị đúng). Mượn Ý TƯỞNG (không copy nguyên khối) từ 2 chỗ ĐÃ CÓ ở
         assets/css/style.css: (1) `.eq-1/.eq-2/.eq-3` (mini cột nhạc nhảy khi bài đang phát, xem
         core/playlist/render.js) — dựng lại thành logo 5 cột "EQ" nhảy lệch nhịp, cùng tông màu
         sky-400→violet-500 với thanh tiến trình bên dưới, đúng bản sắc 1 app nghe nhạc/visualizer;
         (2) `.animate-spin-slow` — không dùng xoay tròn, thay bằng 1 quầng sáng (`glow`) phập phồng
         phía sau logo cho có chiều sâu. Thêm hiệu ứng "chạy sáng" (shimmer) quét ngang thanh tiến
         trình cho đỡ khô, và tên app fade-in nhẹ lúc xuất hiện. Có `prefers-reduced-motion` tắt hết
         phần TRANG TRÍ (giữ lại animation CHỨC NĂNG — width thanh tiến trình vẫn chạy bình thường,
         chỉ do JS set trực tiếp, không phải `@keyframes`, nên không bị tắt theo). -->
    <style>
        #app-preloader { position: fixed; inset: 0; z-index: 9999; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; transition: opacity 0.4s ease-out; }
        #app-preloader.app-preloader-hidden { opacity: 0; pointer-events: none; }

        #app-preloader-logo { position: relative; width: 84px; height: 52px; display: flex; align-items: flex-end; justify-content: center; gap: 6px; }
        #app-preloader-glow { position: absolute; inset: -28px; border-radius: 999px; background: radial-gradient(circle, rgba(56,189,248,0.35) 0%, rgba(139,92,246,0.16) 45%, transparent 72%); animation: app-preloader-glow-pulse 2.6s ease-in-out infinite; }
        .app-preloader-bar { position: relative; width: 8px; height: 22%; border-radius: 4px; background: linear-gradient(180deg, #38bdf8, #8b5cf6); box-shadow: 0 0 10px rgba(56,189,248,0.55); animation-name: app-preloader-eq; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }

        #app-preloader-name { position: relative; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.02em; color: #fff; text-align: center; padding: 0 24px; animation: app-preloader-fade-in 0.6s ease-out both; }
        #app-preloader-bar-track { width: min(260px, 70vw); height: 4px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
        #app-preloader-bar-fill { position: relative; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #8b5cf6); transition: width 0.15s ease-out; overflow: hidden; }
        #app-preloader-bar-fill::after { content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent); animation: app-preloader-shimmer 1.3s linear infinite; }
        #app-preloader-percent { font-family: ui-monospace, monospace; font-size: 12px; color: rgba(255,255,255,0.5); }

        @keyframes app-preloader-eq { 0%, 100% { height: 22%; } 50% { height: 100%; } }
        @keyframes app-preloader-glow-pulse { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 0.9; } }
        @keyframes app-preloader-fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes app-preloader-shimmer { from { transform: translateX(-130%); } to { transform: translateX(230%); } }

        /* Tôn trọng lựa chọn hệ thống "giảm hiệu ứng chuyển động" — chỉ tắt phần TRANG TRÍ thuần
           tuý, KHÔNG đụng #app-preloader-bar-fill (width do JS set trực tiếp mỗi 80ms, là animation
           CHỨC NĂNG thể hiện % thật, không phải @keyframes trang trí). */
        @media (prefers-reduced-motion: reduce) {
            #app-preloader-glow, .app-preloader-bar, #app-preloader-name, #app-preloader-bar-fill::after { animation: none !important; }
        }
    </style>

        <div id="app-preloader-logo">
            <div id="app-preloader-glow"></div>

        <div id="app-preloader-name">Simple Audio Visualizer</div>

    <script>
        (function () {
            var fillEl = document.getElementById('app-preloader-bar-fill');
            var percentEl = document.getElementById('app-preloader-percent');
            var preloaderEl = document.getElementById('app-preloader');

            // FIX (yêu cầu Giang — "% không chạy thật, mặc định 0% hoặc 100%") — 2 NGUYÊN NHÂN GỐC
            // tìm được, cả 2 đều liên quan tới cách đo % (đếm resource qua Performance API):
            //
            // (1) Resource Timing API có GIỚI HẠN BUFFER MẶC ĐỊNH (thường ~150-250 entry tuỳ trình
            //     duyệt) — VƯỢT quá giới hạn này, entry MỚI bị ÂM THẦM BỎ QUA (không lỗi, không
            //     cảnh báo). App này có tới ~176 file <script src> RIÊNG (chưa tính CSS/CDN/ảnh...) —
            //     cộng dồn TOÀN BỘ resource khác của trang, tổng số entry rất dễ VƯỢT NGƯỠNG MẶC ĐỊNH
            //     — `loaded` (đếm qua `performance.getEntriesByType('resource')`) NGỪNG TĂNG giữa
            //     chừng dù script vẫn đang tải tiếp thật — % bị "đứng hình" ở 1 mức nào đó rồi nhảy
            //     thẳng lên 100% khi `window.load` bắn (ép cứng, xem hidePreloader()) — ĐÚNG hiện
            //     tượng "% không chạy thật, chỉ thấy 0%/100%". FIX: chủ động tăng buffer lên dư dả
            //     (500, gấp gần 3 lần số script hiện có, chừa chỗ cho tăng trưởng sau này) NGAY LÚC
            //     BẮT ĐẦU, trước khi bất kỳ resource nào kịp tải xong.
            //
            // (2) Trên mạng nhanh (hoặc cache trình duyệt còn hiệu lực từ lần ghé trước) — TOÀN BỘ
            //     176+ script có thể tải xong trong CHƯA TỚI 80ms (chu kỳ poll đầu tiên) — `window.
            //     load` bắn TRƯỚC KHI setInterval() kịp chạy lần nào — % thật (đang tăng dần) KHÔNG
            //     BAO GIỜ kịp vẽ ra màn hình, người dùng chỉ thấy "0%" tĩnh (giá trị khởi tạo cứng
            //     trong HTML) rồi NHẢY THẲNG "100%" (ép cứng bởi hidePreloader()) — ĐÚNG PHẦN CÒN
            //     LẠI của hiện tượng Giang mô tả. FIX: tách phần đo % ra 1 hàm riêng, gọi NGAY LẬP
            //     TỨC (đồng bộ, không đợi tick đầu của setInterval) TRƯỚC KHI đăng ký interval — dù
            //     mạng nhanh cỡ nào, ít nhất 1 lần đo % thật cũng kịp render trước khi có gì ép 100%.
            if (typeof performance.setResourceTimingBufferSize === 'function') {
                performance.setResourceTimingBufferSize(500);
            }

            function measureProgress() {
                var total = document.querySelectorAll('script[src]').length;
                if (total === 0) return; // guard: parser chưa tới thẻ script nào (cực hiếm)
                var loaded = 0;
                try {
                    var resources = performance.getEntriesByType('resource');
                    for (var i = 0; i < resources.length; i++) {
                        if (resources[i].initiatorType === 'script') loaded++;
                    }
                } catch (e) { loaded = 0; } // guard: trình duyệt cổ không có Resource Timing API
                var percent = Math.min(100, Math.round((loaded / total) * 100));
                fillEl.style.width = percent + '%';
                percentEl.textContent = percent + '%';
            }

            measureProgress(); // (2) đo NGAY LẬP TỨC, không đợi tick đầu 80ms
            var pollTimer = setInterval(measureProgress, 80);

            function hidePreloader() {
                clearInterval(pollTimer);
                fillEl.style.width = '100%';
                percentEl.textContent = '100%';
                setTimeout(function () {
                    preloaderEl.classList.add('app-preloader-hidden');
                    setTimeout(function () { preloaderEl.remove(); }, 450); // sau khi fade xong hẳn (transition 0.4s + đệm)
                }, 150);
            }
            window.addEventListener('load', hidePreloader);
        })();
    </script>
