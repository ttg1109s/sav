    <!-- FIX (04/07/2026, mục 7 phản hồi Giang) + HOÀN TÁC (04/07/2026, phản hồi đợt 2, mục 4 — bug
         "lòi modal subtitle" + tiêu đề Photo & Album bị đẩy lệch trên iOS Safari):
         - `viewport-fit=cover` đã THÊM rồi GỠ HẲN: Giang xác nhận nguyên nhân — khi bàn phím trượt
           lên (ô nhập liệu trong Settings) hoặc thanh Safari tự thu/giãn lúc cuộn (dynamic
           toolbar), trình duyệt tính lại chiều cao khả dụng; các drawer/modal `fixed inset-0` +
           `transform: translateY(100%)` có thể "lệch" 1 nhịp trong lúc đó, lòi ra 1 dải mỏng ở
           cạnh dưới/đẩy lệch phần top — chỉ tạm ổn định lại sau "Restart App" ở chế độ Add to Home
           Screen, RẤT KHÔNG ổn định ở Safari tab thường. QUYẾT ĐỊNH: bỏ hẳn `viewport-fit=cover`,
           để trình duyệt tự CHỪA vùng notch/status bar theo cơ chế mặc định (ổn định tuyệt đối,
           không phụ thuộc dynamic-toolbar/bàn phím) — KHÔNG CÓ giải pháp CSS nào ổn định hơn cho
           layout, vì bản chất trình duyệt đã tự lo liệu khi tắt cover. `.safe-top`/`.safe-bottom`/
           override `#visualizer-top-bar`/`#player-container` (từng thêm ở assets/css/style.css)
           ĐÃ DỌN SẠCH (không chỉ để inert) — không còn ý nghĩa gì khi không dùng cover.
         - Vùng notch/status bar giờ do CHÍNH TRÌNH DUYỆT vẽ (không phải nội dung trang) — CSS
           KHÔNG còn khả năng ảnh hưởng màu của nó. Đòn bẩy DUY NHẤT còn lại là `theme-color` dưới
           đây — GIỮ NGUYÊN #000000, KHÔNG đồng bộ theo `vizConfig.bgColor`, để màu vùng đó ổn định
           tuyệt đối, không đổi theo màu nền Settings. Nếu bác VẪN thấy đỏ sau khi đã thử lại: (1)
           rất có thể `index.html` CHÍNH NÓ đang bị cache (khác các file `.js`/`.css` có `?v=` để
           ép tải lại, bản thân `index.html` KHÔNG có cơ chế đó — trình duyệt/GitHub Pages có thể
           phục vụ bản cache cũ CHƯA có thẻ `theme-color` này) — thử mở bằng tab ẩn danh/xoá cache
           Safari để loại trừ; (2) nếu vẫn đỏ ở tab ẩn danh, khả năng Safari đang lấy màu từ
           `favicon.png` (một số bản Safari tự suy màu thanh địa chỉ từ icon trang khi không chắc
           theme-color) — cần xem lại màu chủ đạo của chính file đó. -->
    <meta name="theme-color" content="#000000">
    <!-- Phòng thêm 1 lớp (một số bản Safari CHỈ áp dụng đúng theme-color khi có scope theo
         color-scheme, bỏ qua thẻ không điều kiện ở trên trong 1 số trường hợp) — cùng giá trị
         #000000 cho cả 2 scheme, không có ý nghĩa "đổi theo sáng/tối" ở đây, chỉ để tăng độ tin cậy
         nhận diện của trình duyệt. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
