    <style>
        #app-preloader { position: fixed; inset: 0; z-index: 9999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; transition: opacity 0.35s ease-out; }
        #app-preloader.app-preloader-hidden { opacity: 0; pointer-events: none; }
        #app-preloader.app-preloader-dark { background: #18181b; }
        #app-preloader-logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #38bdf8, #8b5cf6); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(99,102,241,0.28); }
        #app-preloader-logo svg { width: 28px; height: 28px; }
        #app-preloader-name { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; text-align: center; color: #0f172a; }
        .app-preloader-dark #app-preloader-name { color: #f4f4f5; }
        #app-preloader-dots { position: relative; width: 36px; height: 36px; margin-top: 8px; color: #94a3b8; }
        .app-preloader-dark #app-preloader-dots { color: #71717a; }
        .app-preloader-morphin #app-preloader-name { color: #ffffff; }
        .app-preloader-morphin #app-preloader-dots { color: rgba(255, 255, 255, 0.9); }
        .app-preloader-dot { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: currentColor; opacity: 0.15; animation: app-preloader-dot-fade 1s ease-in-out infinite; }
        .app-preloader-dot:nth-child(1) { transform: rotate(0deg) translate(16px); animation-delay: 0s; }
        .app-preloader-dot:nth-child(2) { transform: rotate(45deg) translate(16px); animation-delay: 0.125s; }
        .app-preloader-dot:nth-child(3) { transform: rotate(90deg) translate(16px); animation-delay: 0.25s; }
        .app-preloader-dot:nth-child(4) { transform: rotate(135deg) translate(16px); animation-delay: 0.375s; }
        .app-preloader-dot:nth-child(5) { transform: rotate(180deg) translate(16px); animation-delay: 0.5s; }
        .app-preloader-dot:nth-child(6) { transform: rotate(225deg) translate(16px); animation-delay: 0.625s; }
        .app-preloader-dot:nth-child(7) { transform: rotate(270deg) translate(16px); animation-delay: 0.75s; }
        .app-preloader-dot:nth-child(8) { transform: rotate(315deg) translate(16px); animation-delay: 0.875s; }
        @keyframes app-preloader-dot-fade { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .app-preloader-dot { animation-duration: 1.8s; }
        }
    </style>

        </div>
        <div id="app-preloader-name">Audivis</div>
        <div id="app-preloader-dots">
            <span class="app-preloader-dot"></span><span class="app-preloader-dot"></span><span class="app-preloader-dot"></span><span class="app-preloader-dot"></span>

        </div>
    </div>
    <script>
        (function () {
            var preloaderEl = document.getElementById('app-preloader');
            try {
                var savedUiTheme = localStorage.getItem('uiThemeName');
                if (savedUiTheme === 'dark' || savedUiTheme === 'morphin') {
                    preloaderEl.classList.add('app-preloader-dark');
                }
                if (savedUiTheme === 'morphin') {
                    preloaderEl.classList.add('app-preloader-morphin');
                    var bootBackdrop = null;
                    try { bootBackdrop = JSON.parse(localStorage.getItem('uiThemeBoot') || 'null'); } catch (e2) { bootBackdrop = null; }
                    preloaderEl.style.background = (bootBackdrop && typeof bootBackdrop.preloaderBg === 'string' && bootBackdrop.preloaderBg) || '#0f172a';
                    if (bootBackdrop && typeof bootBackdrop.statusBar === 'string' && bootBackdrop.statusBar) {
                        document.body.style.backgroundColor = bootBackdrop.statusBar;
                        var themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');
                        for (var mi = 0; mi < themeColorMetas.length; mi++) themeColorMetas[mi].setAttribute('content', bootBackdrop.statusBar);
                    }
                }
            } catch (e) {   }
            window.markPlaylistBootReady = function () {
                hidePreloader();
            };
            var safetyTimer = setTimeout(function () {
                console.warn('[preloader] Chưa nhận tín hiệu markPlaylistBootReady() sau 10s — tự ẩn preloader (an toàn), có thể do lỗi JS ở boot sequence.');
                hidePreloader();
            }, 10000);
            var hidden = false;
            function hidePreloader() {
                if (hidden) return;
                hidden = true;
                clearTimeout(safetyTimer);
                preloaderEl.classList.add('app-preloader-hidden');
                setTimeout(function () { preloaderEl.remove(); }, 400);
            }
        })();
    </script>
