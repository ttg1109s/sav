<!--
    video-editor.html — Trang RIÊNG để sửa video (MỚI, Batch 1, module Video Editor — nối vào
    action "editVideo" đã có sẵn ở Video Manager, trước đây chỉ alert "coming soon"). Cùng kiến
    trúc `image-edit.html`/`subtitle-editor.html`: mở qua `?video=<key đã mã hoá>`, tự nạp script
    riêng, đọc/ghi CHUNG 1 IndexedDB với trang chính (cùng origin `file://`).

    PHẠM VI BATCH 1: Crop + Rotate (90°) + Filter màu (brightness/contrast/saturation) — CHƯA có
    nút Lưu (Batch 4). Mọi chỉnh sửa crop/rotate/filter/cut ở đây chỉ là STATE + PREVIEW, chưa
    "nướng" thành file thật (xem event/workflow/video-editor.js).

    PHẠM VI BATCH 2 (MỚI): Cut (chọn khoảng thời gian giữ lại) + Trích xuất ảnh (chụp khung hình
    hiện tại, lưu THẲNG vào IndexedDB store 'images' — KHÔNG qua Save/engine, xuất tức thì).

    Thư viện:
    - Cropper.js v1 (CDN, UMD, global `Cropper`) — dùng lại ĐÚNG bản CDN đã có sẵn cho
      image-edit.html — CHỈ dùng cho khung crop trên 1 ảnh TĨNH chụp từ video, KHÔNG chạy trực
      tiếp trên `<video>`. Đây là dùng chung THƯ VIỆN, KHÔNG phải dùng chung CODE với image-edit.
    - Mediabunny (CDN, global `Mediabunny`) — bọc quanh WebCodecs API của trình duyệt, dùng để
      đọc/ghi file video thật (`core/video-editor/webcodecs-engine.js`,
      `core/video-editor/compat-guard.js`). CHƯA TỰ VERIFY được URL/bản build này bằng cách chạy
      thật trong sandbox viết code — nếu script lỗi không nạp được, kiểm tra lại tại
      https://github.com/Vanilagy/mediabunny/releases (bản đang trỏ: v1.46.0).
    - Brightness/Contrast/Saturation dùng CSS `filter` lúc xem preview — "nướng" thật vào canvas
      lúc xử lý (`core/video-editor/webcodecs-engine.js`, sẽ được gọi ở Batch 4 lúc bấm Lưu).
-->

    <script src="core/debug-console.js?v=20260718v1"></script>
    <script>
        // Bắt lỗi TẢI SCRIPT/CSS (404, mất mạng...) — các lỗi này KHÔNG bao giờ gọi console.error()
        // (không phải lỗi JS chạy sai, mà là lỗi tải resource ở tầng trình duyệt) nên
        // core/debug-console.js phía trên KHÔNG tự bắt được — phải tự lắng nghe 'error' trên
        // window Ở PHA CAPTURE (lỗi tải resource KHÔNG bubble lên, bắt ở pha bubble sẽ không thấy
        // gì). Đây chính là nghi vấn hàng đầu cho lỗi Giang đang gặp (CDN Mediabunny 404).
        window.addEventListener('error', (e) => {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                console.error(`[resource-load-error] Không tải được: ${e.target.src || e.target.href}`);
            }
        }, true); // true = capture phase, BẮT BUỘC
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20260715v1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <!-- Mediabunny — KHÔNG dùng 1 URL cố định (URL trước đó đã xác nhận 404 qua debug console của
         Giang). Thử LẦN LƯỢT nhiều ứng viên (thứ tự ưu tiên: đoán đúng nhất trước, dựa theo cấu
         trúc thật `dist/bundles/mediabunny-ac3.mjs` của gói con cùng dự án) — cái nào tải được thì
         dùng, dừng ngay, KHÔNG thử tiếp. Chỉ báo lỗi 'mediabunnyNotLoaded' khi TẤT CẢ đều fail.
         QUAN TRỌNG: script tạo bằng createElement() vốn dĩ BẤT ĐỒNG BỘ (không tự chặn các thẻ
         <script> tĩnh phía sau chạy trước) — expose `window._mediabunnyLoadPromise` để
         event/workflow/video-editor.js::init() tự `await` trước khi gọi checkVideoEditorCompat(),
         tránh race condition kiểm tra "chưa tải xong" nhầm thành "không tải được". -->
    <script>
        window._mediabunnyLoadPromise = new Promise((resolve) => {
            const candidates = [
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/mediabunny.cjs',
            ];
            let i = 0;
            function tryNext() {
                if (i >= candidates.length) {
                    console.error('[loadMediabunnyWithFallback] Đã thử hết ' + candidates.length + ' URL, KHÔNG url nào tải được Mediabunny.');
                    resolve(false); // resolve (KHÔNG reject) — nơi gọi tự kiểm tra typeof Mediabunny, không cần try/catch riêng
                    return;
                }
                const url = candidates[i++];
                const el = document.createElement('script');
                el.src = url;
                el.onload = () => { console.log(`[loadMediabunnyWithFallback] Tải được Mediabunny từ: ${url}`); resolve(true); };
                el.onerror = () => { console.warn(`[loadMediabunnyWithFallback] Fail: ${url} — thử URL kế tiếp.`); tryNext(); };
                document.head.appendChild(el);
            }
            tryNext();
        });
    </script>
</head>

        document.getElementById('btn-ve-reset-label').textContent = t('videoEdit.btnReset.title');
        document.getElementById('label-ve-filter-brightness').textContent = t('videoEdit.filterBrightness');
        document.getElementById('label-ve-filter-contrast').textContent = t('videoEdit.filterContrast');
        document.getElementById('label-ve-filter-saturation').textContent = t('videoEdit.filterSaturation');
        document.getElementById('video-editor-crop-title').textContent = t('videoEdit.cropOverlay.title');
        document.getElementById('btn-video-editor-crop-cancel').textContent = t('videoEdit.cropOverlay.cancel');
        document.getElementById('btn-video-editor-crop-confirm').textContent = t('videoEdit.cropOverlay.confirm');
        document.getElementById('btn-ve-crop-reset').textContent = t('videoEdit.cropReset.label');
        // MỚI (Batch 2).
        document.getElementById('btn-ve-cut-label').textContent = t('videoEdit.btnCut.title');
        document.getElementById('btn-ve-extract-frame-label').textContent = t('videoEdit.btnExtractFrame.title');
        document.getElementById('btn-ve-cut-reset').textContent = t('videoEdit.cutReset.label');
        document.getElementById('video-editor-cut-title').textContent = t('videoEdit.cutOverlay.title');
        document.getElementById('btn-video-editor-cut-cancel').textContent = t('videoEdit.cutOverlay.cancel');
        document.getElementById('btn-video-editor-cut-confirm').textContent = t('videoEdit.cutOverlay.confirm');

        // Debug overlay — CỐ Ý viết thẳng ở đây, KHÔNG qua eventBus (tiện ích chẩn đoán, không
        // phải nghiệp vụ của trang — cùng tinh thần ngoại lệ mà core/debug-console.js đã nêu).
        const debugOverlayEl = document.getElementById('video-editor-debug-overlay');
        const debugBodyEl = document.getElementById('video-editor-debug-body');
        function renderDebugLogs() {
            const logs = getDebugConsoleLogs(); // core/debug-console.js
            debugBodyEl.textContent = logs.map((entry) => {
                const time = new Date(entry.time).toLocaleTimeString();
                const tag = entry.level === 'error' ? '🔴' : entry.level === 'warn' ? '🟡' : '⚪';
                return `${tag} ${time}  ${entry.text}`;
            }).join('\n') || '(chưa có log nào)';
            debugBodyEl.scrollTop = debugBodyEl.scrollHeight;
        }
        document.getElementById('btn-video-editor-debug-toggle').addEventListener('click', () => {
            renderDebugLogs();
            debugOverlayEl.classList.remove('hidden');
        });
        document.getElementById('btn-video-editor-debug-close').addEventListener('click', () => {
            debugOverlayEl.classList.add('hidden');
        });
        document.getElementById('btn-video-editor-debug-copy').addEventListener('click', () => {
            navigator.clipboard?.writeText(debugBodyEl.textContent).catch(() => {});
        });
    </script>
</body>
</html>
