<!DOCTYPE html>
<!--
    video-editor.html — v2 (23/07/2026), viết lại khung UI theo prototype `video.txt` (CapCut-style:
    canvas preview + transport bar riêng + timeline đa track Video/Audio/Text + bottom-sheet 4 tab),
    thay hẳn toolbar icon rời rạc của bản Batch 1-2 cũ. TOÀN BỘ quyết định kiến trúc đã chốt với
    Giang qua hội thoại — xem `plan-video-editor.md` mục 0 (KHÔNG lặp lại chi tiết ở đây).

    TÓM TẮT những gì ĐỔI so với bản cũ (để đọc code không bỡ ngỡ):
    - Bỏ hẳn `<video controls>` native — preview 100% qua canvas (#video-editor-preview-canvas),
      vòng lặp vẽ chạy qua `taskManager` mode `raf` (event/workflow/video-editor.js).
    - Cut: bỏ overlay filmstrip riêng — chuyển thành kéo-thả 2 tay cầm TRỰC TIẾP trên track Video
      trong timeline chính (đúng cơ chế video.txt) — filmstrip.js vẫn tái dùng để lấy ảnh thật lấp
      vào track đó (không viết "filmstrip mới").
    - Crop: GIỮ Cropper.js (overlay #video-editor-crop-overlay bên dưới, không đổi so với bản cũ).
    - Nhạc chèn: chọn từ IndexedDB (không upload file), panel tự viết (không Generic Drawer/appState),
      tìm kiếm dùng chung core/song-search.js với Playlist UI.
    - Text overlay: MỚI, giữ theo yêu cầu Giang (ngoài 7 yêu cầu gốc).
    - Lưu: dropdown Ghi đè | Lưu mới (core/dropdown-menu.js) — Batch 4.
    - Split theo giây + nén zip (JSZip, đã có sẵn CDN cho Playlist) — Batch 4.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Edit Video</title>
    <!-- core/debug-console.js PHẢI nạp ĐẦU TIÊN TUYỆT ĐỐI (không đổi so với bản cũ). -->
    <script src="core/debug-console.js?v=20260718v1"></script>
    <script>
        window.addEventListener('error', (e) => {
            if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                console.error(`[resource-load-error] Không tải được: ${e.target.src || e.target.href}`);
            }
        }, true);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { future: { hoverOnlyWhenSupported: true } };
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20260715v1">
    <!-- MỚI (v2) — CSS riêng module này, tách từ video.txt (xem plan mục 7). -->
    <link rel="stylesheet" href="assets/css/video-editor.css?v=20260723v1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <!-- JSZip — MỚI (v2, Batch 4 Split) — ĐÃ có sẵn CDN cho Playlist (index.html), dùng lại đúng bản. -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <!-- Mediabunny — không đổi so với bản cũ (nhiều URL dự phòng, chưa xác nhận cuối cùng). -->
    <script>
        window._mediabunnyLoadPromise = new Promise((resolve) => {
            const candidates = [
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/mediabunny.cjs',
            ];
            let i = 0;
            function tryNext() {
                if (i >= candidates.length) {
                    console.error('[loadMediabunnyWithFallback] Đã thử hết ' + candidates.length + ' URL, KHÔNG url nào tải được Mediabunny.');
                    resolve(false);
                    return;
                }
                const url = candidates[i++];
                const el = document.createElement('script');
                el.src = url;
                el.onload = () => { console.log(`[loadMediabunnyWithFallback] Tải được Mediabunny từ: ${url}`); resolve(true); };
                el.onerror = () => { console.warn(`[loadMediabunnyWithFallback] Fail: ${url} — thử URL kế tiếp.`); tryNext(); };
                document.head.appendChild(el);
            }
            tryNext();
        });
    </script>
</head>
<body class="bg-black text-white h-[100dvh] w-full flex flex-col overflow-hidden select-none">
<div id="video-editor-root" class="flex flex-col h-full w-full overflow-hidden">

    <!-- 1. Header -->
    <header class="h-12 video-editor-pt-safe bg-black flex items-center justify-between px-3 shrink-0 z-20 border-b border-white/10">
        <div class="flex items-center gap-2 min-w-0">
            <button id="btn-back-video-editor" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 shrink-0">

            </button>
            <span id="video-editor-title" class="text-xs font-semibold text-slate-200 truncate"></span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-ve-split" class="px-3 py-1.5 bg-white/10 text-white rounded text-xs font-bold active:scale-95 transition"></button>
            <button id="btn-ve-save" class="px-4 py-1.5 bg-white text-black rounded text-xs font-bold shadow active:scale-95 transition"></button>
        </div>
    </header>

    <!-- 2. Preview (canvas) -->
    <section class="relative flex items-center justify-center bg-[#0a0a0a] h-[32vh] shrink-0 overflow-hidden border-b border-white/10">
        <canvas id="video-editor-preview-canvas" class="max-w-full max-h-full object-contain"></canvas>
        <div id="video-editor-empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-black/70 text-center px-6">
            <p id="video-editor-empty-state-text" class="text-xs text-slate-400"></p>
        </div>
        <p id="video-editor-fatal-error" class="hidden absolute inset-0 flex items-center justify-center text-sm text-slate-400 text-center px-8"></p>
    </section>

    <!-- 3. Transport bar -->
    <section class="h-10 bg-[#121212] flex items-center justify-between px-3 shrink-0 border-b border-white/10">
        <div class="text-[11px] font-mono text-slate-400 w-20">
            <span id="video-editor-current-time" class="text-white">00:00</span>/<span id="video-editor-total-time">00:00</span>
        </div>
        <div class="flex items-center justify-center gap-6 flex-1">
            <button id="btn-ve-skip-start" class="text-slate-400 text-base active:scale-90 transition">|&lt;</button>
            <button id="btn-ve-play" class="text-white text-lg w-8 text-center active:scale-90 transition">
                <span id="video-editor-play-icon">&#9654;</span>
            </button>
            <button id="btn-ve-skip-end" class="text-slate-400 text-base active:scale-90 transition">&gt;|</button>
        </div>
        <div class="w-20"></div>
    </section>

    <!-- 4. Timeline (đa track) + bottom-sheet panel -->
    <section class="flex-1 min-h-0 relative flex flex-col bg-black overflow-hidden">
        <div id="video-editor-timeline-container" class="flex-1 overflow-auto relative p-3 pt-6">
            <div id="video-editor-timeline-content" class="relative h-full min-h-[170px]" style="width: 100%; min-width: 100%;">
                <div id="video-editor-playhead" class="absolute top-0 bottom-0 left-0 w-[1.5px] bg-white z-40 pointer-events-none hidden shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>

                <div class="absolute top-0 left-0 w-full flex flex-col gap-2.5">
                    <!-- Track Text -->
                    <div class="h-9 relative rounded-lg bg-white/5 border border-white/10">
                        <div id="video-editor-clip-text" class="hidden absolute h-full top-0 bg-purple-500/80 rounded-lg border border-white/20 overflow-hidden">
                            <div class="video-editor-clip-handle absolute left-0 top-0 bottom-0 w-3.5 bg-white/20 rounded-l-lg z-10" data-handle="textStart"></div>
                            <div class="video-editor-clip-body absolute inset-0" data-handle="textMove"></div>
                            <span class="text-[9px] font-bold px-4 truncate pointer-events-none absolute inset-0 flex items-center" id="video-editor-clip-text-label"></span>
                            <div class="video-editor-clip-handle absolute right-0 top-0 bottom-0 w-3.5 bg-white/20 rounded-r-lg z-10" data-handle="textEnd"></div>
                        </div>
                    </div>

                    <!-- Track Video (Cut = kéo 2 tay cầm trực tiếp ở đây) -->
                    <div class="h-16 relative rounded-lg bg-white/5 border border-white/10">
                        <div id="video-editor-clip-video" class="absolute h-full top-0 bg-slate-800 rounded-lg overflow-hidden border-2 border-transparent">
                            <div class="video-editor-clip-handle absolute left-0 top-0 bottom-0 w-4 bg-white z-10 rounded-l-md" data-handle="videoStart"></div>
                            <div id="video-editor-clip-video-filmstrip" class="absolute inset-0 flex pointer-events-none"></div>
                            <div class="video-editor-clip-handle absolute right-0 top-0 bottom-0 w-4 bg-white z-10 rounded-r-md" data-handle="videoEnd"></div>
                        </div>
                    </div>

                    <!-- Track Audio (nhạc chèn) -->
                    <div class="h-11 relative rounded-lg bg-white/5 border border-white/10">
                        <div id="video-editor-clip-audio" class="hidden absolute h-full top-0 bg-emerald-500/80 rounded-lg border border-white/20 overflow-hidden">
                            <div class="video-editor-clip-body absolute inset-0 flex items-center px-3" data-handle="audioOffsetDrag">
                                <span class="text-[9px] font-bold text-white truncate pointer-events-none" id="video-editor-clip-audio-label"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom-sheet panel (tự viết, KHÔNG Generic Drawer/appState) -->
        <div id="video-editor-tool-panel" class="absolute inset-x-0 bottom-0 h-[36vh] max-h-80 bg-[#1c1c1e] rounded-t-2xl transform translate-y-full transition-transform duration-300 ease-out z-50 flex flex-col border-t border-white/10">
            <div class="h-11 border-b border-white/10 flex justify-between items-center px-4 shrink-0">
                <span id="video-editor-panel-title" class="font-bold text-xs text-white"></span>
                <button id="btn-ve-panel-close" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-slate-400">&#9660;</button>
            </div>
            <div class="flex-1 overflow-y-auto relative p-3">

                <!-- Panel: Video (Crop/Rotate/Reset) -->
                <div id="video-editor-panel-cut" class="video-editor-panel-content absolute inset-0 p-3 hidden flex-col gap-3">
                    <button id="btn-ve-crop" class="w-full py-3 bg-white/10 rounded-xl text-xs font-bold flex items-center justify-center gap-2"></button>
                    <div class="flex items-center justify-between text-[11px] text-slate-400">
                        <span id="video-editor-crop-badge"></span>
                        <button id="btn-ve-crop-reset" class="hidden text-rose-400 underline"></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-ve-rotate-left" class="py-3 bg-white/10 rounded-xl text-xs font-bold"></button>
                        <button id="btn-ve-rotate-right" class="py-3 bg-white/10 rounded-xl text-xs font-bold"></button>
                    </div>
                    <button id="btn-ve-reset" class="mt-2 py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold border border-rose-500/20"></button>
                </div>

                <!-- Panel: Nhạc -->
                <div id="video-editor-panel-audio" class="video-editor-panel-content absolute inset-0 p-3 hidden flex-col gap-2.5">
                    <div class="relative">
                        <input id="video-editor-song-search-input" type="text" inputmode="search" autocomplete="off" class="w-full bg-white/10 border border-white/10 rounded-xl pl-3 pr-8 py-2 text-xs text-white placeholder-slate-500 outline-none">
                        <button id="btn-ve-song-search-clear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs">&times;</button>
                    </div>
                    <div id="video-editor-song-list" class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-1"></div>
                    <button id="btn-ve-remove-song" class="hidden py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold border border-rose-500/20"></button>
                </div>

                <!-- Panel: Chữ (Text overlay) -->
                <div id="video-editor-panel-text" class="video-editor-panel-content absolute inset-0 p-3 hidden flex-col gap-3">
                    <button id="btn-ve-add-text" class="w-full py-3 bg-purple-500 text-white rounded-xl text-xs font-bold"></button>
                    <div id="video-editor-text-controls" class="hidden flex-col gap-3">
                        <input type="text" id="video-editor-text-value" class="w-full bg-white/10 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-white/5 p-2.5 rounded-xl">
                                <label id="label-ve-text-size" class="block text-[10px] text-slate-400 mb-1.5"></label>
                                <input type="range" id="slider-ve-text-size" min="20" max="150" value="60">
                            </div>
                            <div class="bg-white/5 p-2.5 rounded-xl">
                                <label id="label-ve-text-color" class="block text-[10px] text-slate-400 mb-1.5"></label>
                                <input type="color" id="video-editor-text-color" value="#ffffff" class="w-full h-6 bg-transparent border-0 rounded cursor-pointer p-0">
                            </div>
                        </div>
                        <div class="bg-white/5 p-2.5 rounded-xl">
                            <label class="flex justify-between text-[10px] text-slate-400 mb-1.5">
                                <span id="label-ve-text-posY"></span><span id="video-editor-text-posY-display">80%</span>
                            </label>
                            <input type="range" id="slider-ve-text-posY" min="5" max="95" value="80">
                        </div>
                        <button id="btn-ve-remove-text" class="py-2.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold border border-rose-500/20"></button>
                    </div>
                </div>

                <!-- Panel: Chỉnh (Filter/Volume/Trích xuất ảnh) -->
                <div id="video-editor-panel-properties" class="video-editor-panel-content absolute inset-0 p-3 hidden flex-col gap-4">
                    <div>
                        <h3 id="video-editor-volume-heading" class="text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-2"></h3>
                        <div class="space-y-3 bg-white/5 p-3 rounded-xl">
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-300 mb-1.5"><span id="label-ve-vol-video"></span><span id="video-editor-vol-video-val">100%</span></label>
                                <input type="range" id="slider-ve-vol-video" min="0" max="200" value="100">
                            </div>
                            <div id="video-editor-vol-song-group" class="opacity-40">
                                <label class="flex justify-between text-[10px] text-slate-300 mb-1.5"><span id="label-ve-vol-song"></span><span id="video-editor-vol-song-val">100%</span></label>
                                <input type="range" id="slider-ve-vol-song" min="0" max="200" value="100" disabled>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 id="video-editor-filter-heading" class="text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-2"></h3>
                        <div class="space-y-3 bg-white/5 p-3 rounded-xl">
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-300 mb-1.5"><span id="label-ve-filter-brightness"></span><span id="video-editor-filter-brightness-val">100%</span></label>
                                <input type="range" id="slider-ve-brightness" min="50" max="150" value="100">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-300 mb-1.5"><span id="label-ve-filter-contrast"></span><span id="video-editor-filter-contrast-val">100%</span></label>
                                <input type="range" id="slider-ve-contrast" min="50" max="150" value="100">
                            </div>
                            <div>
                                <label class="flex justify-between text-[10px] text-slate-300 mb-1.5"><span id="label-ve-filter-saturation"></span><span id="video-editor-filter-saturation-val">100%</span></label>
                                <input type="range" id="slider-ve-saturation" min="0" max="200" value="100">
                            </div>
                        </div>
                    </div>
                    <button id="btn-ve-extract-frame" class="py-2.5 rounded-xl bg-white/10 text-xs font-bold"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- 5. Bottom nav (4 tab) -->
    <nav class="h-14 video-editor-pb-safe bg-[#121212] border-t border-white/10 flex items-center justify-around px-2 z-[55] shrink-0">
        <button class="video-editor-tool-tab flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 active:scale-95 transition" data-target="video-editor-panel-cut">
            <span class="text-base">&#9986;</span>
            <span id="tab-ve-cut-label" class="text-[9px] font-bold uppercase"></span>
        </button>
        <button class="video-editor-tool-tab flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 active:scale-95 transition" data-target="video-editor-panel-audio">
            <span class="text-base">&#9835;</span>
            <span id="tab-ve-audio-label" class="text-[9px] font-bold uppercase"></span>
        </button>
        <button class="video-editor-tool-tab flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 active:scale-95 transition" data-target="video-editor-panel-text">
            <span class="text-base">T</span>
            <span id="tab-ve-text-label" class="text-[9px] font-bold uppercase"></span>
        </button>
        <button class="video-editor-tool-tab flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 active:scale-95 transition" data-target="video-editor-panel-properties">
            <span class="text-base">&#9881;</span>
            <span id="tab-ve-properties-label" class="text-[9px] font-bold uppercase"></span>
        </button>
    </nav>

    <!-- Overlay Crop — GIỮ NGUYÊN từ bản cũ (Cropper.js trên khung hình tĩnh). -->
    <div id="video-editor-crop-overlay" class="hidden fixed inset-0 z-[70] bg-black flex flex-col">
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0">
            <button id="btn-video-editor-crop-cancel" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-sm font-semibold transition-colors"></button>
            <span id="video-editor-crop-title" class="text-sm font-semibold"></span>
            <button id="btn-video-editor-crop-confirm" class="px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-sm font-bold transition-colors"></button>
        </div>
        <div class="flex-1 min-h-0 relative bg-black">
            <img id="video-editor-crop-source" class="max-w-full block" alt="">
        </div>
    </div>

    <!-- Modal Split — MỚI (v2, Batch 4). -->
    <div id="video-editor-split-modal" class="hidden fixed inset-0 bg-black/90 z-[75] flex-col items-center justify-center backdrop-blur-md p-6">
        <div class="bg-[#1c1c1e] border border-white/10 rounded-2xl p-5 w-full max-w-sm flex flex-col gap-4">
            <h3 id="video-editor-split-title" class="font-bold text-base text-white text-center"></h3>
            <div id="video-editor-split-setup-box" class="space-y-3">
                <label id="video-editor-split-input-label" class="block text-xs text-slate-400"></label>
                <input id="video-editor-split-seconds-input" type="number" min="1" class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-center">
                <button id="btn-video-editor-split-start" class="w-full py-3 bg-white text-black rounded-xl text-sm font-bold"></button>
                <button id="btn-video-editor-split-cancel" class="w-full py-2 bg-transparent text-slate-500 text-xs font-bold"></button>
            </div>

                <div id="video-editor-split-progress-text" class="text-center text-xs text-slate-400"></div>

    <!-- Debug console mobile — GIỮ NGUYÊN từ bản cũ. -->
    <button id="btn-video-editor-debug-toggle" class="fixed bottom-3 left-3 z-[80] w-10 h-10 rounded-full bg-slate-700/80 backdrop-blur flex items-center justify-center text-sm">🐞</button>
    <div id="video-editor-debug-overlay" class="hidden fixed inset-0 z-[81] bg-black/95 flex flex-col">
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0">
            <span class="text-sm font-semibold">Debug Console</span>
            <div class="flex items-center gap-2">
                <button id="btn-video-editor-debug-copy" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-semibold">Copy</button>
                <button id="btn-video-editor-debug-close" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-semibold">Đóng</button>
            </div>
        </div>
        <pre id="video-editor-debug-body" class="flex-1 min-h-0 overflow-y-auto px-3 py-2 text-[10px] leading-relaxed whitespace-pre-wrap font-mono"></pre>
    </div>

    <!-- Thẻ ẩn để decode — canvas preview lấy pixel từ đây. -->
    <video id="video-editor-source" class="hidden" playsinline crossorigin="anonymous"></video>
    <audio id="video-editor-song-audio" class="hidden" crossorigin="anonymous"></audio>
</div>

        document.getElementById('video-editor-filter-heading').textContent = t('videoEdit.filterHeading');
        document.getElementById('label-ve-filter-brightness').textContent = t('videoEdit.filterBrightness');

        document.getElementById('btn-video-editor-split-cancel').textContent = t('common.cancel');

        // Debug overlay — CỐ Ý viết thẳng ở đây, không qua eventBus (tiện ích chẩn đoán).
        const debugOverlayEl = document.getElementById('video-editor-debug-overlay');
        const debugBodyEl = document.getElementById('video-editor-debug-body');
        function renderDebugLogs() {
            const logs = getDebugConsoleLogs();
            debugBodyEl.textContent = logs.map((entry) => {
                const time = new Date(entry.time).toLocaleTimeString();
                const tag = entry.level === 'error' ? '🔴' : entry.level === 'warn' ? '🟡' : '⚪';
                return `${tag} ${time}  ${entry.text}`;
            }).join('\n') || '(chưa có log nào)';
            debugBodyEl.scrollTop = debugBodyEl.scrollHeight;
        }
        document.getElementById('btn-video-editor-debug-toggle').addEventListener('click', () => {
            renderDebugLogs();
            debugOverlayEl.classList.remove('hidden');
        });
        document.getElementById('btn-video-editor-debug-close').addEventListener('click', () => {
            debugOverlayEl.classList.add('hidden');
        });
        document.getElementById('btn-video-editor-debug-copy').addEventListener('click', () => {
            navigator.clipboard?.writeText(debugBodyEl.textContent).catch(() => {});
        });
