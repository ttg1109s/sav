    - Track Video/Nhạc/Chữ giờ đều là TIMELINE ĐA-CLIP (mảng), không còn 1 cutRange/1 bài hát/1 dòng
      chữ duy nhất. Video: các đoạn nối tiếp nhau, không hở, không xoá được (chỉ trim/tách/nhân bản/
      đổi thứ tự). Nhạc/Chữ: clip TỰ DO (vị trí + độ dài riêng), trim/di chuyển/tách/nhân bản/xoá được.
    - Bỏ hẳn bottom-sheet 4 tab — quay lại toolbar icon SVG hàng ngang (giống bản Batch 1-2 cũ), nội
      dung ĐỔI THEO đang chọn Video/Nhạc/Chữ nào (dựng động trong event/workflow/video-editor.js).
    - Split (nút riêng + modal nhập giây) BỎ HẲN — thay bằng "Cắt" trong toolbar, tách đoạn ĐANG CHỌN
      tại đúng vị trí con trỏ hiện tại.
    - Fix bug "phải Play mới hiện khung/time đầu" (thẻ <video> ẩn bằng display:none trước đây khiến
      1 số trình duyệt mobile trì hoãn decode) — xem thẻ <video id="video-editor-source"> cuối file.

    [v4, 24/07/2026, phản hồi Giang — 5 việc]
    a) Bố cục ĐỔI HẲN từ flex tỉ lệ (3/1/1) sang `position:fixed` (xem assets/css/video-editor.css,
       biến `--ve-header-h`/`--ve-timeline-h`/`--ve-toolbar-h`): toolbar `bottom:0`, timeline áp sát
       ngay trên toolbar, preview lấp phần còn lại giữa header và timeline. 2 <section> preview/
       timeline nay có id riêng (`video-editor-preview-section`/`video-editor-timeline-section`) để
       CSS nhắm đúng — trước đây vô danh, chỉ set qua style="flex:...".
    b) Track Chữ chuyển xuống vị trí THỨ 3 (dưới cùng) — thứ tự mới: Video → Nhạc → Chữ (trước:
       Chữ → Video → Nhạc).
    c) BUG "không bấm được vào Text trên preview" — KHÔNG phải do logic kéo/pinch (đã đúng), mà do
       `assets/css/style.css` (dùng CHUNG mọi trang) có rule KHÔNG SCOPE `canvas { position:absolute;
       width:100vw; height:100dvh; pointer-events:none; }` (viết cho canvas visualizer ở index.html)
       — áp lộn lên LUÔN `#video-editor-preview-canvas` vì trang này cũng nạp chung style.css. Sửa
       bằng 1 override SCOPE riêng theo ID trong video-editor.css (không đụng style.css dùng chung).
    d) Bỏ hẳn "Chỉnh" (Brightness/Contrast/Saturation/Volume toàn cục) — Volume nay là THUỘC TÍNH
       RIÊNG của TỪNG đoạn Video (`_videoClips[i].volume`), mở qua toolbar lúc đang CHỌN 1 đoạn Video
       (nút Volume mới, xem event/workflow/video-editor.js::handleVideoClipVolumeOpen()).
    e) "Dịch chuyển đoạn" (chọn khúc nào của bài hát phát trong khoảng clip) đổi từ thanh màu kéo tay
       trừu tượng sang WAVEFORM THẬT — tái dùng WaveSurfer.js v7 + Regions plugin (đúng thư viện/
       pattern đã dùng ở subtitle-editor.html, xem 2 <script> CDN mới ngay dưới đây). Vùng chọn
       (Region) LUÔN giữ NGUYÊN độ rộng (= độ dài clip trên timeline, đúng logic cũ) — kéo CHỈ dịch
       offset trong bài hát (`resize:false`, `drag:true`). Thêm nút Play chỉ phát ĐÚNG vùng chọn.
       Slider Volume (0-200%) SỬA để cập nhật NGAY lúc kéo (trước chỉ áp lúc đổi bài hát) + dùng
       GainNode (core/video-editor/media-gain.js, MỚI) để mức >100% ra ĐÚNG cả lúc xem trước lẫn lúc
       xuất thật (thẻ <audio>/<video> gốc không thể khuếch đại vượt 100%).
-->

    <script>
        window._mediabunnyLoadPromise = new Promise((resolve) => {
            const candidates = [
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny@1.46.0/dist/bundles/mediabunny.cjs',
                'https://unpkg.com/mediabunny/dist/bundles/mediabunny.cjs',
                'https://cdn.jsdelivr.net/npm/mediabunny@1.46.0/dist/mediabunny.cjs',
            ];
            let i = 0;
            function tryNext() {
                if (i >= candidates.length) { console.error('[loadMediabunnyWithFallback] Đã thử hết ' + candidates.length + ' URL, KHÔNG url nào tải được Mediabunny.'); resolve(false); return; }
                const url = candidates[i++];
                const el = document.createElement('script');
                el.src = url;
                el.onload = () => { console.log(`[loadMediabunnyWithFallback] Tải được Mediabunny từ: ${url}`); resolve(true); };
                el.onerror = () => { console.warn(`[loadMediabunnyWithFallback] Fail: ${url} — thử URL kế tiếp.`); tryNext(); };
                document.head.appendChild(el);
            }
            tryNext();
        });
    </script>

    <script src="event/listener/video-editor.js?v=20260724v1"></script>
    <script>
        document.getElementById('btn-ve-save').textContent = t('videoEdit.btnSave.title');
        document.getElementById('video-editor-empty-state-text').textContent = t('videoEdit.loading');
        document.getElementById('video-editor-crop-title').textContent = t('videoEdit.cropOverlay.title');
        document.getElementById('btn-video-editor-crop-cancel').textContent = t('videoEdit.cropOverlay.cancel');
        document.getElementById('btn-video-editor-crop-confirm').textContent = t('videoEdit.cropOverlay.confirm');

        document.getElementById('btn-video-editor-reload').addEventListener('click', () => { window.location.reload(); });
        const debugOverlayEl = document.getElementById('video-editor-debug-overlay');
        const debugBodyEl = document.getElementById('video-editor-debug-body');
        function renderDebugLogs() {
            const logs = getDebugConsoleLogs();
            debugBodyEl.textContent = logs.map((entry) => {
                const time = new Date(entry.time).toLocaleTimeString();
                const tag = entry.level === 'error' ? '🔴' : entry.level === 'warn' ? '🟡' : '⚪';
                return `${tag} ${time}  ${entry.text}`;
            }).join('\n') || '(chưa có log nào)';
            debugBodyEl.scrollTop = debugBodyEl.scrollHeight;
        }
        document.getElementById('btn-video-editor-debug-toggle').addEventListener('click', () => { renderDebugLogs(); debugOverlayEl.classList.remove('hidden'); });
        document.getElementById('btn-video-editor-debug-close').addEventListener('click', () => { debugOverlayEl.classList.add('hidden'); });
        document.getElementById('btn-video-editor-debug-copy').addEventListener('click', () => { navigator.clipboard?.writeText(debugBodyEl.textContent).catch(() => {}); });
    </script>
</body>
</html>
