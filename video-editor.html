<!DOCTYPE html>
<!--
    video-editor.html — Trang RIÊNG cho trình sửa video (MỚI 06/10/2026, Giang: "tách trình editor video thành một trang
    html riêng, tham khảo subtitle editor"; chốt giữ ĐƠN GIẢN, 1 video 1 đoạn cắt — không làm đa clip).
    Mở từ menu 3 chấm của 1 video trong Playlist (workflowPlaylist.navigateToActiveMenuVideoEdit()) qua
    `?video=<key đã mã hoá>` (service/song-key-cipher.js). Nút "<" / Lưu xong -> quay về index.html, tự cuộn tới video.

    KHÔNG nạp lại index.html/main.js — chỉ những gì editor cần: Tailwind build + assets/css/video-preview.css, lang +
    patch, theme Light (modalChoice/dropdown), loading shield, appState (package 'video-preview' + 'app-misc'), bus,
    service/db.js, core crop/engine/filmstrip, file-manager video/image/folder (Lưu + Chụp), 3 workflow dùng chung tách
    từ index.html (video-thumb-extract, photo-duration, video-frame-capture) và cụm videoPreview (workflow/router/listener
    — trước đây sống trong index.html).
-->
